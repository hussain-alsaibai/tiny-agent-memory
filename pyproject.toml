[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tiny-agent-memory"
version = "0.1.0"
description = "Zero-dependency memory system for AI agents. Semantic + working + episodic memory in one file."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "OpenClaw", email = "hussain.alsaibai@gmail.com"}
]
keywords = ["agent", "memory", "context", "ai", "llm", "semantic", "vector", "tiny"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Artificial Intelligence",
    "Typing :: Typed",
]

[project.optional-dependencies]
numpy = ["numpy>=1.24"]

[tool.setuptools.packages.find]
where = ["."]
include = ["tiny_agent_memory*"]

[tool.pytest.ini_options]
# The test file lives at the repo root, not in tests/. Pointing testpaths at a
# non-existent directory makes pytest warn and fall back to a recursive scan;
# naming the real file keeps the run deterministic.
testpaths = ["test_tiny_agent_memory.py"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
